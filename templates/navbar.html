<header class="site-header">
    <a href="{% url 'mainpage' %}" class="brand" aria-label="Trivivo home">
        <span class="brand-mark" aria-hidden="true">?</span>
        <span>Trivivo</span>
    </a>
    <nav class="nav-links" aria-label="Primary">
        <a href="{% url 'quiz_start' %}" class="nav-link">Play</a>
        <a href="{% url 'leaderboard' %}" class="nav-link">Leaderboard</a>
        {% if user.is_authenticated %}
        <a href="{% url 'scores' %}" class="nav-link">Dashboard</a>
        <span class="nav-link">Hi, {{ request.user.username }}</span>
        <a href="{% url 'logout' %}" class="btn btn-plain btn-small">Log out</a>
        {% else %}
        <a href="{% url 'login' %}" class="btn btn-plain btn-small">Log in</a>
        {% endif %}
    </nav>
</header>
