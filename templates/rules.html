{% extends 'base.html' %}
{% block content %}
<section class="page split-page">
    <div class="panel">
        <p class="eyebrow">Before the clock starts</p>
        <h1 class="title">Ready for the hot seat?</h1>
        <p class="subtitle">Your game is prepared. Confirm when you are ready for question one.</p>
        {% include 'components/prestart_details.html' %}
        <form class="button-row" method="post">
            {% csrf_token %}
            <button class="btn btn-plain" type="submit" name="agreed" value="no">Leave game</button>
            <button class="btn btn-primary" type="submit" name="agreed" value="yes">Start the quiz</button>
        </form>
    </div>
    {% include 'components/prize_ladder.html' %}
</section>
{% endblock content %}
