{% extends 'base.html' %}
{% block content %}
<section class="auth-wrap">
    <div class="panel">
        <div class="auth-heading">
            <p class="eyebrow">Join the game</p>
            <h1 class="title">Create account</h1>
            <p class="subtitle">Save your scores and climb the board.</p>
        </div>
        <form method="post">
            {% csrf_token %}
            <label class="field" for="usernameInput">
                <span class="field-label">Username</span>
                <input class="input" type="text" id="usernameInput" name="username" autocomplete="username" placeholder="Choose a username" required>
            </label>
            <label class="field" for="emailInput">
                <span class="field-label">Email</span>
                <input class="input" type="email" id="emailInput" name="email" autocomplete="email" placeholder="you@example.com" required>
            </label>
            <label class="field" for="passwordInput">
                <span class="field-label">Password</span>
                <input class="input" type="password" id="passwordInput" name="password" autocomplete="new-password" placeholder="At least 8 characters" required>
            </label>
            <label class="field" for="password2Input">
                <span class="field-label">Confirm password</span>
                <input class="input" type="password" id="password2Input" name="password2" autocomplete="new-password" placeholder="Repeat password" required>
            </label>
            <p class="form-note">Use at least 8 characters. Your password must not contain your username.</p>
            <button class="btn btn-primary" type="submit" style="width: 100%; margin-top: 16px;">Create account</button>
        </form>
        <p class="auth-switch">Already registered? <a class="ink-link" href="{% url 'login' %}">Log in</a></p>
    </div>
</section>
{% endblock content %}
