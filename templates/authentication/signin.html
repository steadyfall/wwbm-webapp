{% extends 'base.html' %}
{% block content %}
<section class="auth-wrap">
    <div class="panel">
        <div class="auth-heading">
            <p class="eyebrow">Welcome back</p>
            <h1 class="title">Log in to play</h1>
            <p class="subtitle">Your place on the ladder is waiting.</p>
        </div>
        <form method="post">
            {% csrf_token %}
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
            <label class="field" for="usernameInput">
                <span class="field-label">Username</span>
                <input class="input" type="text" id="usernameInput" name="username" autocomplete="username" placeholder="Your username" required autofocus>
            </label>
            <label class="field" for="passwordInput">
                <span class="field-label">Password</span>
                <input class="input" type="password" id="passwordInput" name="password" autocomplete="current-password" placeholder="Your password" required>
            </label>
            <button class="btn btn-primary" type="submit" style="width: 100%;">Log in</button>
        </form>
        <p class="auth-switch">New to Trivivo? <a class="ink-link" href="{% url 'register' %}">Create an account</a></p>
    </div>
</section>
{% endblock content %}
